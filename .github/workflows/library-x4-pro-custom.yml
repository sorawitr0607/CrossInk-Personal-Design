name: Custom Library for X4 Pro

on:
  push:
    branches: [feat/library-collections-x4-pro]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-x4-pro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CROSSINK_LIBRARY_BASE: 9914146eeae7b46b300f475a16c32426fc02ec1f
      CROSSINK_LIBRARY_SDK: 699370183fa3a0e33c9cb83a36f701bbb6022095
      CROSSINK_RELEASE_VERSION: 1.6.1-library.1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify the pinned firmware and SDK
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CROSSINK_LIBRARY_BASE" HEAD
          test "$(git rev-parse HEAD:freeink-sdk)" = "$CROSSINK_LIBRARY_SDK"
          test "$(git -C freeink-sdk rev-parse HEAD)" = "$CROSSINK_LIBRARY_SDK"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install build tools
        run: |
          set -euo pipefail
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system 'resvg-py==0.5.0' 'Pillow==13.0.0' 'clang-format==21.1.8' 'PyYAML==6.0.3' 'fonttools==4.67.0'

      - name: Format the changed C++ sources
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR -z "$CROSSINK_LIBRARY_BASE" HEAD -- '*.cpp' '*.h' |
            xargs -0 -r clang-format -i
          git diff --check
          mkdir -p artifacts
          git diff --binary "$CROSSINK_LIBRARY_BASE" -- . > artifacts/source.patch

      - name: Run the native checks
        run: |
          set -euo pipefail
          cmake -S test -B build/library-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/library-native --parallel 2
          ctest --test-dir build/library-native --output-on-failure

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-library-py3.12-pio6.1.19-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Check C++ defects
        run: pio check -e default --fail-on-defect low --fail-on-defect medium --fail-on-defect high

      - name: Pin the platform Python environment
        run: |
          set -euo pipefail
          pio pkg install -e default -e x4-pro
          uv pip install --python ~/.platformio/penv/bin/python https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Check the shared code on ESP32-C3
        run: |
          set -euo pipefail
          pio run -j2 -e default | tee build/library-c3.log

      - name: Build the X4 Pro firmware
        run: |
          set -euo pipefail
          pio run -j2 -e x4-pro | tee build/library-x4-pro.log

      - name: Verify native X4 Pro Library screens
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          pio run -j2 -e x4-pro-simulator | tee build/library-simulator.log
          python scripts/review_library_simulator.py

      - name: Package the X4 Pro application image
        run: python scripts/package_library_firmware.py

      - name: Upload firmware and source provenance
        uses: actions/upload-artifact@v7
        with:
          name: crossink-1.6.1-library.1-x4-pro
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: library-build-logs
          path: |
            build/library-c3.log
            build/library-x4-pro.log
            build/library-simulator.log
            artifacts/native-library-review/
            artifacts/source.patch
          if-no-files-found: ignore
          retention-days: 14
